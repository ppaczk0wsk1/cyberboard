services:
  # Default: CDN-backed, smaller image
  cyberboard:
    image: ghcr.io/ppaczk0wsk1/cyberboard:latest
    container_name: cyberboard
    ports:
      - "8900:8900"
    volumes:
      - ./data.json:/app/data.json
    restart: unless-stopped

  # Offline: vendors all JS dependencies into the image
  cyberboard-offline:
    build:
      context: .
      dockerfile: Dockerfile.offline
    container_name: cyberboard
    ports:
      - "8900:8900"
    volumes:
      - ./data.json:/app/data.json
    restart: unless-stopped
    profiles:
      - offline
